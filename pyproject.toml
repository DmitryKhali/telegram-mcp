[project]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server for Telegram — read chats, summarize, and send messages from your own account via MTProto."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry Khalitov", email = "dmitry.khali@gmail.com" }]
keywords = ["mcp", "telegram", "telethon", "claude", "llm"]
dependencies = [
    "mcp[cli]>=1.2.0",
    "telethon>=1.36",
    "keyring>=25.0",
    "qrcode>=7.4",
]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"
telegram-mcp-login = "telegram_mcp.login:main"

# NOTE: replace YOUR_GITHUB_USERNAME below before publishing.
[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/telegram-mcp"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/telegram-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]
